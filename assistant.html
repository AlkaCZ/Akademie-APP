<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI asistent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="phone">
    <div class="app assistant-page">
      <header class="topbar">
        <div class="topbar-row">
          <div class="brand">
            <div class="brand-mark">A</div>
            <div class="brand-title">
              <strong>AI asistent</strong>
              <span>Pomoc s kurzy, misemi</span>
            </div>
          </div>

          <a class="icon-btn" href="courses.html" aria-label="Zpět">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </a>
        </div>
      </header>

      <main class="content">
        <section class="panel" style="padding:16px;">
          <h1 class="section-title">Ahoj, jsem AI asistent</h1>
          <p class="subtext">Pomohu ti shrnout lekci, navrhnout další krok nebo vysvětlit konkrétní pojem.</p>
        </section>

        <section class="panel" style="padding:16px; display:grid; gap:12px;">
          <div class="metric">
            <strong>Co umím</strong>
            <span>Shrnutí lekcí, návrh úkolu, feedback k nápadu i doporučení další mise.</span>
          </div>

          <div class="panel" style="padding:14px; border-radius:20px;">
            <label for="assistantPrompt" class="subtext">Napiš dotaz</label>
            <textarea id="assistantPrompt" class="assistant-input" placeholder="Např. Pomoz mi připravit 5 otázek pro customer interview."></textarea>
            <div style="display:flex; justify-content:flex-end; margin-top:12px;">
              <button class="action primary-red" type="button">Odeslat</button>
            </div>
          </div>

          <div class="panel" style="padding:14px;">
            <strong>Doporučené prompty</strong>
            <div class="assistant-chips">
              <button class="chip" type="button">Shrň mi tuto lekci</button>
              <button class="chip" type="button">Navrhni další krok</button>
              <button class="chip" type="button">Pomoz s pricingem</button>
              <button class="chip" type="button">Zlepši value proposition</button>
            </div>
          </div>
        </section>
      </main>

      <nav class="bottom-nav" data-bottom-nav>
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg><span>Domů</span></a>
        <a href="courses.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg><span>Kurzy</span></a>
        <a href="progress.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"></path><path d="M10 19V9"></path><path d="M16 19v-4"></path><path d="M22 19V3"></path></svg><span>Pokrok</span></a>
        <a href="assistant.html" class="active"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"></path><rect x="6" y="8" width="12" height="10" rx="4"></rect><path d="M9 13h.01"></path><path d="M15 13h.01"></path><path d="M9.5 16c.7.67 1.52 1 2.5 1s1.8-.33 2.5-1"></path></svg><span>AI</span></a>
        <a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21a8 8 0 1 0-16 0"></path><circle cx="12" cy="8" r="4"></circle></svg><span>Profil</span></a>
      </nav>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
